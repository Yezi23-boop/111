<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐屏 · LVGL 原型(410×502)</title>
<style>
  :root {
    --bg: #151c2b;
    --panel: #1f2a3c;
    --panel-2: #28364d;
    --border: #35435f;
    --text-strong: #f6f8fc;
    --text-mid: #b3bed2;
    --text-dim: #8290ab;
    --accent: #8a6dff;
    --accent-soft: #ab9aff;
    --accent-glow: rgba(138, 109, 255, 0.38);
    --green: #5de2a5;
    --amber: #f5b84b;
    --radius-lg: 20px;
    --radius-md: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0d1322;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--text-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 28px;
    padding: 24px;
  }

  /* ===== 手表屏幕画布:410×502,与真机 1:1 ===== */
  .watch {
    width: 410px; height: 502px;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(124, 92, 255, 0.22) 0%, rgba(124, 92, 255, 0.05) 42%, transparent 70%),
      var(--bg);
    border-radius: 44px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 0 0 2px #2a3350;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  /* 真机四角圆角遮罩(CO5300 物理遮罩) */
  .watch::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-radius: 44px;
    box-shadow: inset 0 0 0 60px #151c2b;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0.9;
  }

  /* ===== 顶部栏:返回 / 标题 / 登录(坐标对齐板端) ===== */
  .top-bar { position: absolute; left: 0; right: 0; top: 0; height: 60px; }
  .btn-back {
    position: absolute; left: 40px; top: 20px; width: 58px; height: 40px;
    display: flex; align-items: center; justify-content: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-mid);
    font-size: 15px; cursor: pointer; transition: .15s;
  }
  .btn-back:hover { background: var(--panel-2); color: var(--text-strong); }
  .btn-back .chev { font-size: 19px; line-height: 1; }
  .title {
    position: absolute; left: 112px; top: 24px; width: 186px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 600; letter-spacing: 2px;
  }
  .btn-account {
    position: absolute; left: 304px; top: 20px; width: 66px; height: 40px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(124,92,255,.08));
    border: 1px solid rgba(154,138,255,.35); border-radius: 999px;
    color: var(--accent-soft); font-size: 14px; cursor: pointer; transition: .15s;
  }
  .btn-account:hover { background: rgba(124,92,255,.32); }

  /* ===== 正在播放卡片(坐标对齐板端) ===== */
  .track-panel {
    position: absolute; left: 40px; top: 76px; width: 330px; height: 100px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .artwork {
    position: absolute; left: 14px; top: 14px; width: 72px; height: 72px;
    border-radius: 50%;
    background:
      conic-gradient(from 210deg, #8a6dff, #c09dff, #6fa8ff, #8a6dff);
    border: 2px solid var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .artwork::before { /* 唱片高光 */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(140deg, rgba(255,255,255,.34) 0%, transparent 42%);
  }
  .artwork .vinyl {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #4a3a80 0%, #1f2a3c 68%);
    display: flex; align-items: center; justify-content: center;
    transition: transform .4s linear;
  }
  .playing .artwork .vinyl { animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .artwork .hub { width: 14px; height: 14px; border-radius: 50%; background: #171a22; border: 2px solid var(--accent-soft); }
  .track-name {
    position: absolute; left: 100px; top: 13px; width: 214px; height: 27px;
    font-size: 17px; font-weight: 600; line-height: 27px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-artist {
    position: absolute; left: 100px; top: 44px; width: 214px; height: 20px;
    font-size: 13px; color: var(--text-mid); line-height: 20px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .state-pill {
    position: absolute; left: 100px; top: 69px; height: 20px;
    display: flex; align-items: center; gap: 5px;
    font-size: 12.5px; line-height: 1;
  }
  .state-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .state-pill.play .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .state-pill.pause .dot { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .state-pill.idle .dot { background: var(--text-dim); }
  .state-pill.play { color: var(--green); }
  .state-pill.pause { color: var(--amber); }
  .state-pill.idle { color: var(--text-dim); }

  /* ===== 控制按钮(坐标对齐板端) ===== */
  .btn-round {
    position: absolute; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 50%; color: var(--text-strong); cursor: pointer; transition: .15s;
    font-family: inherit;
  }
  .btn-round:hover { background: var(--panel-2); border-color: #48587a; }
  .btn-prev { left: 40px; top: 196px; width: 64px; height: 64px; font-size: 24px; }
  .btn-next { left: 306px; top: 196px; width: 64px; height: 64px; font-size: 24px; }
  .btn-toggle {
    left: 169px; top: 190px; width: 72px; height: 72px;
    background: linear-gradient(145deg, #7a58ff, #a07fff);
    border: none; font-size: 0;
    box-shadow: 0 8px 22px var(--accent-glow);
  }
  .btn-toggle:hover { filter: brightness(1.1); }
  .btn-toggle svg { width: 24px; height: 24px; fill: #0b0d12; }
  .btn-toggle.paused svg.play-ico { display: none; }
  .btn-toggle svg.pause-ico { display: none; }
  .btn-toggle.paused svg.pause-ico { display: block; }

  /* ===== 来源区块(坐标对齐板端) ===== */
  .section-label {
    position: absolute; left: 40px; top: 284px; width: 120px; height: 30px;
    font-size: 16px; font-weight: 600; line-height: 30px;
  }
  .btn-mode {
    position: absolute; left: 174px; top: 280px; width: 92px; height: 34px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text-mid); font-size: 13px; cursor: pointer;
    transition: .15s;
  }
  .btn-mode:hover { color: var(--text-strong); border-color: #48587a; }
  .btn-catalog-back {
    position: absolute; left: 276px; top: 280px; width: 94px; height: 34px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: rgba(124,92,255,.16); border: 1px solid rgba(154,138,255,.4);
    border-radius: 999px; color: var(--accent-soft); font-size: 13px; cursor: pointer;
    transition: .15s;
  }
  .btn-catalog-back:hover { background: rgba(124,92,255,.28); }

  .source-grid { position: absolute; left: 40px; top: 326px; width: 330px; height: 146px; }
  .source-btn {
    position: absolute; width: 160px; height: 50px;
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-md); cursor: pointer; transition: .15s;
    color: var(--text-strong); font-size: 15px;
  }
  .source-btn:nth-child(1) { left: 0;  top: 0; }
  .source-btn:nth-child(2) { left: 170px; top: 0; }
  .source-btn:nth-child(3) { left: 0;  top: 62px; }
  .source-btn:nth-child(4) { left: 170px; top: 62px; }
  .source-btn:hover { background: var(--panel-2); border-color: #48587a; transform: translateY(-1px); }
  .source-btn .ico {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; background: rgba(124,92,255,.16); color: var(--accent-soft);
  }
  .source-btn:nth-child(2) .ico { background: rgba(93,226,165,.14); color: var(--green); }
  .source-btn:nth-child(4) .ico { background: rgba(245,184,75,.14); color: var(--amber); }

  /* ===== 目录列表页 ===== */
  .catalog-list {
    position: absolute; left: 40px; top: 326px; width: 330px; height: 146px;
    overflow-y: auto; scrollbar-width: thin; scrollbar-color: #39415a transparent;
    display: flex; flex-direction: column; gap: 8px;
  }
  .song-row {
    width: 318px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-md); cursor: pointer; transition: .15s;
  }
  .song-row:hover { background: var(--panel-2); border-color: #48587a; }
  .song-row .note {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(124,92,255,.14); color: var(--accent-soft); font-size: 13px;
  }
  .song-row .meta { flex: 1; min-width: 0; }
  .song-row .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .song-row .chev { color: var(--text-dim); font-size: 14px; flex-shrink: 0; }

  /* ===== 二维码登录页 ===== */
  .account-status {
    position: absolute; left: 40px; top: 82px; width: 330px; height: 32px;
    text-align: center; font-size: 15px; color: var(--text-mid); line-height: 32px;
  }
  .qr-card {
    position: absolute; left: 95px; top: 132px; width: 220px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px; text-align: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.4);
  }
  .qr-card .qr {
    width: 184px; height: 184px; margin: 0 auto;
    background: #fff; border-radius: 12px;
    display: grid; grid-template-columns: repeat(21, 1fr); grid-template-rows: repeat(21, 1fr);
    gap: 1px; padding: 8px; background-color: #fff;
  }
  .qr-card .qr i { display: block; background: #111; border-radius: 1px; }
  .qr-card .hint { margin-top: 14px; font-size: 13px; color: var(--text-mid); line-height: 1.6; }

  /* ===== 视图切换 ===== */
  .view { display: none; }
  .view.active { display: block; }

  .note-box {
    color: var(--text-dim); font-size: 13px; line-height: 1.9;
    max-width: 340px; align-self: center;
  }
  .note-box b { color: var(--text-mid); }
  .note-box code { background: #1a2233; padding: 1px 6px; border-radius: 5px; color: var(--accent-soft); font-size: 12px; }
</style>
</head>
<body>

  <div class="watch">
    <!-- ========== 视图 1:来源主页 ========== -->
    <div class="view active" id="view-sources">
      <div class="top-bar">
        <button class="btn-back"><span class="chev">‹</span>返回</button>
        <div class="title">音乐</div>
        <button class="btn-account" onclick="goto('account')">👤 登录</button>
      </div>

      <div class="track-panel" id="track-panel">
        <div class="artwork"><div class="vinyl"><div class="hub"></div></div></div>
        <div class="track-name" id="track-name">星辰大海</div>
        <div class="track-artist" id="track-artist">黄霄雲</div>
        <div class="state-pill play" id="state-pill"><span class="dot"></span><span id="state-text">正在播放</span></div>
      </div>

      <button class="btn-round btn-prev" onclick="alert('上一首')">⏮</button>
      <button class="btn-round btn-toggle playing" id="btn-toggle" onclick="togglePlay()">
        <svg class="play-ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause-ico" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="btn-round btn-next" onclick="alert('下一首')">⏭</button>

      <div class="section-label">音乐来源</div>
      <button class="btn-mode" id="btn-mode" onclick="cycleMode()">🔁 列表循环</button>

      <div class="source-grid">
        <button class="source-btn" onclick="goto('catalog', '今日推荐')"><span class="ico">✦</span>今日推荐</button>
        <button class="source-btn" onclick="goto('catalog', '我喜欢')"><span class="ico">♥</span>我喜欢</button>
        <button class="source-btn" onclick="goto('catalog', '我的歌单')"><span class="ico">☰</span>我的歌单</button>
        <button class="source-btn" onclick="goto('catalog', '最近播放')"><span class="ico">↻</span>最近播放</button>
      </div>
    </div>

    <!-- ========== 视图 2:歌曲目录页 ========== -->
    <div class="view" id="view-catalog">
      <div class="top-bar">
        <button class="btn-back" onclick="goto('sources')"><span class="chev">‹</span>返回</button>
        <div class="title" id="catalog-title">今日推荐</div>
        <button class="btn-account" onclick="goto('account')">👤 登录</button>
      </div>

      <div class="track-panel">
        <div class="artwork"><div class="vinyl"><div class="hub"></div></div></div>
        <div class="track-name">星辰大海</div>
        <div class="track-artist">黄霄雲</div>
        <div class="state-pill play"><span class="dot"></span><span>正在播放</span></div>
      </div>

      <button class="btn-round btn-prev" onclick="alert('上一首')">⏮</button>
      <button class="btn-round btn-toggle playing" onclick="togglePlay()">
        <svg class="play-ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause-ico" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="btn-round btn-next" onclick="alert('下一首')">⏭</button>

      <button class="btn-catalog-back" onclick="goto('sources')">‹ 来源</button>

      <div class="catalog-list" id="catalog-list">
        <!-- 歌曲行由 JS 填充 -->
      </div>
    </div>

    <!-- ========== 视图 3:二维码登录页 ========== -->
    <div class="view" id="view-account">
      <div class="top-bar">
        <button class="btn-back" onclick="goto('sources')"><span class="chev">‹</span>返回</button>
        <div class="title">登录</div>
        <button class="btn-account" style="opacity:.35; pointer-events:none;">👤 登录</button>
      </div>
      <div class="account-status" id="account-status">扫码登录云端音乐账号</div>
      <div class="qr-card">
        <div class="qr" id="qr-canvas"></div>
        <div class="hint">打开手机 App<br>扫一扫完成登录</div>
      </div>
    </div>
  </div>

  <div class="note-box">
    <b>工具/ui_prototypes/music/index.html</b><br>
    · 画布 410×502 与真机 1:1,坐标对齐板端 <code>music_view.c</code><br>
    · 三个视图(来源主页 / 歌曲目录 / 扫码登录)可点击切换<br>
    · 中间播放键切换 播放/暂停,右上角进入登录页<br>
    · 设计定稿后,把颜色/间距/字号换算回 LVGL
  </div>

<script>
  // ===== 视图切换 =====
  const MODE_ORDER = ["列表循环", "单曲循环", "随机播放"];
  let modeIdx = 0;

  function goto(view) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + view).classList.add("active");
    if (view === "catalog" && arguments[1]) {
      document.getElementById("catalog-title").textContent = arguments[1];
      fillCatalog(arguments[1]);
    }
  }

  // ===== 播放/暂停 =====
  function togglePlay() {
    const btn = document.getElementById("btn-toggle");
    const pill = document.getElementById("state-pill");
    const text = document.getElementById("state-text");
    const panel = document.getElementById("track-panel");
    const playing = btn.classList.toggle("paused");
    panel.classList.toggle("playing", !playing);
    pill.className = "state-pill " + (playing ? "pause" : "play");
    text.textContent = playing ? "已暂停" : "正在播放";
  }

  // ===== 播放模式循环 =====
  function cycleMode() {
    modeIdx = (modeIdx + 1) % MODE_ORDER.length;
    const icons = { "列表循环": "🔁", "单曲循环": "🔂", "随机播放": "🔀" };
    document.getElementById("btn-mode").innerHTML =
      icons[MODE_ORDER[modeIdx]] + " " + MODE_ORDER[modeIdx];
  }

  // ===== 目录数据(按来源填充示例歌曲) =====
  const LIBRARY = {
    "今日推荐": [["星辰大海", "黄霄雲"], ["富士山下", "陈奕迅"], ["光年之外", "邓紫棋"], ["成都", "赵雷"]],
    "我喜欢":   [["晴天", "周杰伦"], ["平凡之路", "朴树"], ["七里香", "周杰伦"], ["南山南", "马頔"]],
    "我的歌单": [["贝加尔湖畔", "李健"], ["理想", "赵雷"], ["安河桥", "宋冬野"], ["消愁", "毛不易"]],
    "最近播放": [["孤勇者", "陈奕迅"], ["向云端", "小霞"], ["阿刁", "张韶涵"], ["鸿雁", "呼斯楞"]]
  };
  const NOTES = ["♪", "♫", "♬", "♩"];

  function fillCatalog(source) {
    const list = document.getElementById("catalog-list");
    const rows = (LIBRARY[source] || []).map((t, i) => `
      <button class="song-row" onclick="alert('播放:${t[0]}')">
        <span class="note">${NOTES[i % 4]}</span>
        <span class="meta"><span class="name">${t[0]}</span>
        <div class="sub">${t[1]}</div></span>
        <span class="chev">›</span>
      </button>`);
    list.innerHTML = rows.join("");
  }

  // ===== 伪二维码占位(21×21 随机格) =====
  (function buildQR() {
    const box = document.getElementById("qr-canvas");
    for (let i = 0; i < 21 * 21; i++) {
      const cell = document.createElement("i");
      if (i % 17 === 0 || i % 23 === 0) cell.style.background = "#fff";
      box.appendChild(cell);
    }
  })();
</script>
</body>
</html>
