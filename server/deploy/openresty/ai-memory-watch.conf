map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name hermes.934000.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hermes.934000.xyz;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/hermes.934000.xyz/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/hermes.934000.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name watch.934000.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name watch.934000.xyz;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/watch.934000.xyz/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/watch.934000.xyz/privkey.pem;

    # 只公开手表协议命名空间；容器健康检查和内部回调不能从公网访问。
    location = /health {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    # OTA 管理上传需要内部管理员入口，不随手表公网域名暴露。
    location ^~ /v1/watch/ota/admin {
        return 404;
    }

    location ^~ /v1/watch/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 音乐控制和持续音频流单独转发；服务端自行校验 device token。
    # MCP 只接受 POST JSON-RPC，并限制请求体/等待时间；Authorization 原样转发给
    # music-service，由独立 MUSIC_MCP_TOKEN 校验，不使用手表 device token。
    location = /v1/music/mcp {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # 不代理 music-service 的 health、调试接口、Cookie 或上游 API。
    location ^~ /v1/music/ {
        proxy_pass http://127.0.0.1:18788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
