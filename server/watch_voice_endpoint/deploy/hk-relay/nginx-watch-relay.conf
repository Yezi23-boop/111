map $http_upgrade $watch_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream watch_endpoint_origin {
    server 127.0.0.1:18787;
    keepalive 8;
}

server {
    listen 127.0.0.1:18080;
    server_name _;

    location = /relay-health {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://watch_endpoint_origin/health;
    }

    location /v1/watch/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $watch_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_pass http://watch_endpoint_origin;
    }

    location / {
        return 404;
    }
}

server {
    listen 20340 ssl;
    server_name watch-hk.934000.xyz;

    ssl_certificate /etc/nginx/tls/watch-hk.crt;
    ssl_certificate_key /etc/nginx/tls/watch-hk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WATCH_RELAY_TLS:1m;
    ssl_session_timeout 10m;

    location /v1/watch/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $watch_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_pass http://watch_endpoint_origin;
    }

    location / {
        return 404;
    }
}
