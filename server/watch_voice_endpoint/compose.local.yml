services:
  watch-voice-endpoint:
    build:
      context: .
    image: ai-memory-watch-voice-endpoint:dev
    container_name: ai-memory-watch-voice-endpoint
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - D:/Docker_data/hermes/watch_voice_endpoint.env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
