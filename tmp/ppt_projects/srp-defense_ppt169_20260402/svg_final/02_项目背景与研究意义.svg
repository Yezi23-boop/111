<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="70" fill="#1F4E79" />
  <rect x="0" y="0" width="6" height="70" fill="#D97A32" />
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">01 项目背景与研究意义</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">广州城市理工学院</text>

  <rect x="0" y="70" width="1280" height="50" fill="#EAF1FB" />
  <rect x="0" y="70" width="6" height="50" fill="#5B8FD9" />
  <text x="40" y="102" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    助残设备的关键价值，在于把高风险环境信息转化为用户可及时理解的反馈。
  </text>

  <rect x="40" y="145" width="540" height="495" rx="14" fill="#F8FBFF" stroke="#C9D7E8" />
  <rect x="40" y="145" width="12" height="495" rx="6" fill="#1F4E79" />
  <text x="78" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">典型使用痛点</text>

  <rect x="78" y="214" width="464" height="108" rx="12" fill="#FFFFFF" stroke="#D7E3F1" />
  <circle cx="112" cy="252" r="16" fill="#D97A32" />
  <text x="112" y="258" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">1</text>
  <text x="142" y="248" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">视障用户难以及时感知危险声源</text>
  <text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="142" y="278">鸣笛、警笛等声音与出行安全直接相关，</text><text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="142" y="302">但传统方案难以在贴身设备上完成实时提醒。</text><rect x="78" y="338" width="464" height="108" rx="12" fill="#FFFFFF" stroke="#D7E3F1" />
  <circle cx="112" cy="376" r="16" fill="#D97A32" />
  <text x="112" y="382" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">2</text>
  <text x="142" y="372" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">听障用户需要更直观的信息转化方式</text>
  <text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="142" y="402">关键声音若能转化为视觉、状态或触觉提示，</text><text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="142" y="426">可以明显降低获取外界信息的门槛。</text><rect x="78" y="462" width="464" height="142" rx="12" fill="#FFFFFF" stroke="#D7E3F1" />
  <circle cx="112" cy="500" r="16" fill="#D97A32" />
  <text x="112" y="506" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">3</text>
  <text x="142" y="496" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">嵌入式可穿戴平台的实现门槛并不低</text>
  <text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="142" y="526">智能手表同时受限于算力、内存、屏幕尺寸与交互方式，</text><text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="142" y="550">项目不仅要证明“能做”，还要证明“能在端侧稳定运行”。</text><rect x="606" y="145" width="634" height="495" rx="14" fill="#FFFFFF" stroke="#C9D7E8" />
  <text x="642" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">研究意义</text>

  <rect x="642" y="214" width="562" height="116" rx="12" fill="#EAF1FB" />
  <text x="672" y="248" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">1. 面向助残场景的工程价值</text>
  <text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="672" y="278">把高风险声音识别、界面交互和联网能力结合到腕上设备，</text><text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="672" y="302">探索更轻量、更贴身的辅助感知方案。</text><rect x="642" y="346" width="562" height="116" rx="12" fill="#F8FBFF" stroke="#D7E3F1" />
  <text x="672" y="380" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">2. 面向嵌入式端侧 AI 的实践价值</text>
  <text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="672" y="410">项目聚焦 ESP32-S3 上的离线识别、线程边界、</text><text font-size="17" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" x="672" y="434">后台联网与 UI 协同，具有典型工程训练意义。</text><rect x="642" y="478" width="562" height="126" rx="12" fill="#1F4E79" />
  <text x="672" y="515" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold">一句话概括</text>
  <text font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" x="672" y="548">本项目并非单点功能演示，而是围绕助残需求，</text><text font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" x="672" y="572">完成“可穿戴交互 + 离线识别 + 联网扩展”的系统化验证。</text><line x1="40" y1="665" x2="1240" y2="665" stroke="#EAF1FB" stroke-width="1" />
  <text x="40" y="695" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">数据来源：SRP 立项申请表、结题报告书</text>
  <text x="640" y="695" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">研究背景</text>
  <text x="1220" y="695" text-anchor="end" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">02</text>
</svg>