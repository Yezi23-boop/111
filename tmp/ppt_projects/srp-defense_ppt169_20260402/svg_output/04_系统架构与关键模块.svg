<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#1F4E79"/>
  <rect x="0" y="0" width="6" height="70" fill="#D97A32"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">03 系统架构与关键模块</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">广州城市理工学院</text>

  <rect x="0" y="70" width="1280" height="50" fill="#EAF1FB"/>
  <rect x="0" y="70" width="6" height="50" fill="#5B8FD9"/>
  <text x="40" y="102" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    系统采用前后台分工方式运行：前台负责交互可用，后台持续完成联网、识别与服务调度。
  </text>

  <rect x="40" y="145" width="610" height="495" rx="14" fill="#F8FBFF" stroke="#C9D7E8"/>
  <text x="72" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">系统架构模块框图</text>

  <rect x="252" y="310" width="196" height="116" rx="18" fill="#1F4E79"/>
  <text x="350" y="355" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold">ESP32-S3</text>
  <text x="350" y="386" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">主控与任务调度中心</text>

  <rect x="86" y="188" width="182" height="90" rx="14" fill="#FFFFFF" stroke="#5B8FD9" stroke-width="2"/>
  <text x="177" y="225" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">显示 / 触摸</text>
  <text x="177" y="253" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">LVGL + CO5300 + FT5x06</text>

  <rect x="432" y="188" width="182" height="90" rx="14" fill="#FFFFFF" stroke="#5B8FD9" stroke-width="2"/>
  <text x="523" y="225" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">联网服务</text>
  <text x="523" y="253" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">Wi-Fi 配网 + 服务就绪探测</text>

  <rect x="86" y="458" width="182" height="90" rx="14" fill="#FFFFFF" stroke="#D97A32" stroke-width="2"/>
  <text x="177" y="495" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">危险检测</text>
  <text x="177" y="523" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">traffic_inference + alert</text>

  <rect x="432" y="458" width="182" height="90" rx="14" fill="#FFFFFF" stroke="#D97A32" stroke-width="2"/>
  <text x="523" y="495" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">AI 对话</text>
  <text x="523" y="523" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">official_chat_service</text>

  <line x1="268" y1="278" x2="316" y2="310" stroke="#5B8FD9" stroke-width="3"/>
  <polygon points="316,310 304,307 310,297" fill="#5B8FD9"/>
  <line x1="432" y1="278" x2="384" y2="310" stroke="#5B8FD9" stroke-width="3"/>
  <polygon points="384,310 390,297 396,307" fill="#5B8FD9"/>
  <line x1="268" y1="458" x2="316" y2="426" stroke="#D97A32" stroke-width="3"/>
  <polygon points="316,426 310,439 304,429" fill="#D97A32"/>
  <line x1="432" y1="458" x2="384" y2="426" stroke="#D97A32" stroke-width="3"/>
  <polygon points="384,426 396,429 390,439" fill="#D97A32"/>

  <rect x="72" y="576" width="546" height="42" rx="10" fill="#EAF1FB"/>
  <text x="345" y="603" text-anchor="middle" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">
    前台界面可立即使用，后台网络与 AI 服务持续探测并延后就绪
  </text>

  <rect x="680" y="145" width="560" height="495" rx="14" fill="#FFFFFF" stroke="#C9D7E8"/>
  <text x="712" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">关键模块说明</text>

  <rect x="712" y="214" width="496" height="92" rx="12" fill="#F8FBFF" stroke="#D7E3F1"/>
  <text x="742" y="246" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">显示 / 触摸模块</text>
  <text x="742" y="271" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="742" dy="0">负责手表页面显示、触摸输入与</tspan>
    <tspan x="742" dy="22">UI 主线程刷新，保证交互层稳定运行。</tspan>
  </text>

  <rect x="712" y="322" width="496" height="92" rx="12" fill="#F8FBFF" stroke="#D7E3F1"/>
  <text x="742" y="354" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">联网模块</text>
  <text x="742" y="379" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="742" dy="0">负责 Wi-Fi 自动连接、配网入口与</tspan>
    <tspan x="742" dy="22">服务可用性探测，为 AI 页提供状态依据。</tspan>
  </text>

  <rect x="712" y="430" width="496" height="92" rx="12" fill="#FFF8F2" stroke="#F1C7A8"/>
  <text x="742" y="462" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">危险检测模块</text>
  <text x="742" y="487" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="742" dy="0">负责离线音频推理、状态判定和</tspan>
    <tspan x="742" dy="22">红屏/提示音联动，是安全感知核心路径。</tspan>
  </text>

  <rect x="712" y="538" width="496" height="92" rx="12" fill="#EAF1FB" stroke="#C9D7E8"/>
  <text x="742" y="570" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">AI 对话模块</text>
  <text x="742" y="595" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="742" dy="0">负责联网后进入对话前台、消息缓存，</tspan>
    <tspan x="742" dy="22">以及页面状态切换与会话生命周期管理。</tspan>
  </text>

  <line x1="40" y1="665" x2="1240" y2="665" stroke="#EAF1FB" stroke-width="1"/>
  <text x="40" y="695" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">数据来源：项目上下文文档、结题报告书</text>
  <text x="640" y="695" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">系统架构</text>
  <text x="1220" y="695" text-anchor="end" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">04</text>
</svg>
