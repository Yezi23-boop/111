<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#1F4E79"/>
  <rect x="0" y="0" width="6" height="70" fill="#D97A32"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">06 实物照片与界面展示</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">广州城市理工学院</text>

  <rect x="0" y="70" width="1280" height="50" fill="#EAF1FB"/>
  <rect x="0" y="70" width="6" height="50" fill="#5B8FD9"/>
  <text x="40" y="102" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    当前答辩材料已能展示页面级交互效果；实物照片和结构视图可在后续补图后直接替换占位区域。
  </text>

  <rect x="40" y="145" width="500" height="495" rx="14" fill="#F8FBFF" stroke="#C9D7E8"/>
  <text x="72" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">实物 / 结构视图展示位</text>

  <rect x="72" y="218" width="436" height="174" rx="14" fill="#FFFFFF" stroke="#C9D7E8" stroke-dasharray="10,6"/>
  <text x="290" y="294" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">实物照片占位</text>
  <text x="290" y="324" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">可替换为手表整机、佩戴效果或桌面摆拍</text>

  <rect x="72" y="412" width="436" height="174" rx="14" fill="#FFFFFF" stroke="#C9D7E8" stroke-dasharray="10,6"/>
  <text x="290" y="488" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">结构视图占位</text>
  <text x="290" y="518" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">可替换为硬件结构、模块布局或系统结构示意</text>

  <rect x="570" y="145" width="670" height="495" rx="14" fill="#FFFFFF" stroke="#C9D7E8"/>
  <text x="602" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">当前界面证据</text>

  <rect x="602" y="216" width="270" height="352" rx="16" fill="#F8FBFF" stroke="#D7E3F1"/>
  <image href="../images/home-ui.png" x="622" y="236" width="230" height="306" preserveAspectRatio="xMidYMid meet"/>
  <rect x="622" y="236" width="230" height="306" rx="18" fill="none" stroke="#C9D7E8"/>
  <text x="737" y="590" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">主界面展示</text>
  <text x="737" y="614" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">入口清晰，适合作为多功能手表主页面</text>

  <rect x="920" y="216" width="270" height="352" rx="16" fill="#F8FBFF" stroke="#D7E3F1"/>
  <image href="../images/ai-dialog.png" x="940" y="236" width="230" height="306" preserveAspectRatio="xMidYMid meet"/>
  <rect x="940" y="236" width="230" height="306" rx="18" fill="none" stroke="#C9D7E8"/>
  <text x="1055" y="590" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">AI 对话页面</text>
  <text x="1055" y="614" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">可显示联网状态、消息气泡与交互入口</text>

  <line x1="40" y1="665" x2="1240" y2="665" stroke="#EAF1FB" stroke-width="1"/>
  <text x="40" y="695" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">数据来源：用户提供的界面截图与答辩素材目录</text>
  <text x="640" y="695" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">效果展示</text>
  <text x="1220" y="695" text-anchor="end" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">07</text>
</svg>
