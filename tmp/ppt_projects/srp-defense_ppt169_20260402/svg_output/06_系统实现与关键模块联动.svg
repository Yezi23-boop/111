<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#1F4E79"/>
  <rect x="0" y="0" width="6" height="70" fill="#D97A32"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">05 系统实现与关键模块联动</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">广州城市理工学院</text>

  <rect x="0" y="70" width="1280" height="50" fill="#EAF1FB"/>
  <rect x="0" y="70" width="6" height="50" fill="#5B8FD9"/>
  <text x="40" y="102" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    系统从启动到底层任务协同，已形成“界面先可用，服务后台持续接入”的运行闭环。
  </text>

  <rect x="40" y="145" width="1200" height="182" rx="14" fill="#F8FBFF" stroke="#C9D7E8"/>
  <text x="72" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">启动与联动时序</text>

  <rect x="76" y="228" width="180" height="68" rx="12" fill="#1F4E79"/>
  <text x="166" y="258" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">hardware_init</text>
  <text x="166" y="282" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">硬件与基础资源初始化</text>

  <rect x="302" y="228" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#5B8FD9" stroke-width="2"/>
  <text x="392" y="258" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">lvgl_task</text>
  <text x="392" y="282" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">页面创建与 UI 主循环</text>

  <rect x="528" y="228" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#5B8FD9" stroke-width="2"/>
  <text x="618" y="258" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">network_service</text>
  <text x="618" y="282" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">联网与服务就绪探测</text>

  <rect x="754" y="228" width="180" height="68" rx="12" fill="#FFFFFF" stroke="#D97A32" stroke-width="2"/>
  <text x="844" y="258" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">danger_detection</text>
  <text x="844" y="282" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">危险检测后台任务</text>

  <rect x="980" y="228" width="220" height="68" rx="12" fill="#FFFFFF" stroke="#D97A32" stroke-width="2"/>
  <text x="1090" y="258" text-anchor="middle" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">official_chat_service</text>
  <text x="1090" y="282" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">AI 对话生命周期管理</text>

  <line x1="256" y1="262" x2="302" y2="262" stroke="#5B8FD9" stroke-width="3"/>
  <polygon points="302,262 290,256 290,268" fill="#5B8FD9"/>
  <line x1="482" y1="262" x2="528" y2="262" stroke="#5B8FD9" stroke-width="3"/>
  <polygon points="528,262 516,256 516,268" fill="#5B8FD9"/>
  <line x1="708" y1="262" x2="754" y2="262" stroke="#D97A32" stroke-width="3"/>
  <polygon points="754,262 742,256 742,268" fill="#D97A32"/>
  <line x1="934" y1="262" x2="980" y2="262" stroke="#D97A32" stroke-width="3"/>
  <polygon points="980,262 968,256 968,268" fill="#D97A32"/>

  <rect x="72" y="340" width="1136" height="68" rx="12" fill="#EAF1FB"/>
  <text x="640" y="370" text-anchor="middle" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">
    UI 主线程只负责页面刷新与状态显示，后台任务负责联网、推理和会话状态推进
  </text>
  <text x="640" y="396" text-anchor="middle" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    这样可以降低线程竞争与界面异常风险，适合资源受限的手表平台
  </text>

  <text x="40" y="452" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">模块职责与联动结果</text>

  <rect x="40" y="474" width="376" height="150" rx="14" fill="#FFFFFF" stroke="#C9D7E8"/>
  <text x="68" y="510" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold">显示与状态更新</text>
  <text x="68" y="542" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">
    <tspan x="68" dy="0">• `lvgl_task` 统一管理 LVGL 对象刷新</tspan>
    <tspan x="68" dy="24">• 后台结果通过状态映射更新页面与覆盖层</tspan>
    <tspan x="68" dy="24">• 危险触发时切换红屏与提示控件</tspan>
  </text>

  <rect x="452" y="474" width="376" height="150" rx="14" fill="#FFFFFF" stroke="#C9D7E8"/>
  <text x="480" y="510" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold">联网与 AI 页面联动</text>
  <text x="480" y="542" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">
    <tspan x="480" dy="0">• 页面读取 `network_service` 的联网状态</tspan>
    <tspan x="480" dy="24">• 服务就绪后才允许进入 AI 对话前台</tspan>
    <tspan x="480" dy="24">• 页面退出时显式停机会话，减少崩溃风险</tspan>
  </text>

  <rect x="864" y="474" width="376" height="150" rx="14" fill="#FFF8F2" stroke="#F1C7A8"/>
  <text x="892" y="510" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold">危险提示闭环</text>
  <text x="892" y="542" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">
    <tspan x="892" dy="0">• 识别任务输出统一危险状态</tspan>
    <tspan x="892" dy="24">• 提示音、红屏与页面状态同步联动</tspan>
    <tspan x="892" dy="24">• 退出页面后可回收资源并终止后台识别</tspan>
  </text>

  <line x1="40" y1="665" x2="1240" y2="665" stroke="#EAF1FB" stroke-width="1"/>
  <text x="40" y="695" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">数据来源：111.c、hardware_init.c、network_service.c、danger_detection_service.c</text>
  <text x="640" y="695" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">模块联动</text>
  <text x="1220" y="695" text-anchor="end" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">06</text>
</svg>
