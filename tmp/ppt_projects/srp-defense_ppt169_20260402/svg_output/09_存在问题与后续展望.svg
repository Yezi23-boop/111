<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="70" fill="#1F4E79"/>
  <rect x="0" y="0" width="6" height="70" fill="#D97A32"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">08 存在问题与后续展望</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">广州城市理工学院</text>

  <rect x="0" y="70" width="1280" height="50" fill="#EAF1FB"/>
  <rect x="0" y="70" width="6" height="50" fill="#D97A32"/>
  <text x="40" y="102" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    当前结题已证明核心路线可行，下一阶段重点是把功能做深、把稳定性做实、把用户验证做完整。
  </text>

  <rect x="40" y="145" width="520" height="495" rx="14" fill="#F8FBFF" stroke="#C9D7E8"/>
  <text x="72" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">当前仍存在的问题</text>

  <rect x="72" y="218" width="456" height="102" rx="12" fill="#FFFFFF" stroke="#D7E3F1"/>
  <text x="100" y="250" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">1. 功能完整度仍有提升空间</text>
  <text x="100" y="278" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">
    心率、BLE/手机协同、长期低功耗优化等设想尚未在当前仓库中完整落地。
  </text>

  <rect x="72" y="336" width="456" height="102" rx="12" fill="#FFFFFF" stroke="#D7E3F1"/>
  <text x="100" y="368" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">2. 识别类别与数据集仍需扩展</text>
  <text x="100" y="396" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">
    目前主要聚焦喇叭和警笛，后续还需引入更多真实道路场景与声音类别。
  </text>

  <rect x="72" y="454" width="456" height="102" rx="12" fill="#FFFFFF" stroke="#D7E3F1"/>
  <text x="100" y="486" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">3. 稳定性与用户研究仍需继续完善</text>
  <text x="100" y="514" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">
    AI 对话弱网表现、长时间运行边界，以及正式用户测试与可用性评价还不充分。
  </text>

  <rect x="590" y="145" width="650" height="495" rx="14" fill="#FFFFFF" stroke="#C9D7E8"/>
  <text x="622" y="186" fill="#1F4E79" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">后续展望</text>

  <line x1="700" y1="236" x2="700" y2="552" stroke="#5B8FD9" stroke-width="4"/>
  <circle cx="700" cy="256" r="14" fill="#1F4E79"/>
  <circle cx="700" cy="394" r="14" fill="#D97A32"/>
  <circle cx="700" cy="532" r="14" fill="#5B8FD9"/>

  <rect x="740" y="216" width="450" height="82" rx="12" fill="#F8FBFF" stroke="#D7E3F1"/>
  <text x="770" y="248" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">阶段一：补强感知与通信能力</text>
  <text x="770" y="270" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="770" dy="0">扩展声音类别，继续引入传感器、BLE</tspan>
    <tspan x="770" dy="22">和更多外围联动能力。</tspan>
  </text>

  <rect x="740" y="354" width="450" height="82" rx="12" fill="#FFF8F2" stroke="#F1C7A8"/>
  <text x="770" y="386" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">阶段二：补强稳定性与功耗验证</text>
  <text x="770" y="408" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="770" dy="0">优化网络异常恢复、长时间运行表现</tspan>
    <tspan x="770" dy="22">和低功耗策略，形成更稳定的样机。</tspan>
  </text>

  <rect x="740" y="492" width="450" height="82" rx="12" fill="#EAF1FB" stroke="#C9D7E8"/>
  <text x="770" y="524" fill="#233142" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold">阶段三：补强用户研究与成果沉淀</text>
  <text x="770" y="546" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
    <tspan x="770" dy="0">组织真实用户测试，完善演示材料，</tspan>
    <tspan x="770" dy="22">并推进软著、专利等成果整理。</tspan>
  </text>

  <rect x="622" y="590" width="568" height="34" rx="17" fill="#1F4E79"/>
  <text x="906" y="612" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">
    当前项目已经具备继续深化和产品化验证的工程基础
  </text>

  <line x1="40" y1="665" x2="1240" y2="665" stroke="#EAF1FB" stroke-width="1"/>
  <text x="40" y="695" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">数据来源：项目结题报告中的问题与建议、项目上下文文档</text>
  <text x="640" y="695" text-anchor="middle" fill="#8D97A5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">后续展望</text>
  <text x="1220" y="695" text-anchor="end" fill="#5B6572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">09</text>
</svg>
