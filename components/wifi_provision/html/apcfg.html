<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能手表配网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 28px;
        }

        .header h1 {
            font-size: 22px;
            color: #1a1a2e;
            font-weight: 600;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-scan {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-bottom: 20px;
        }

        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-scan:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        .btn-submit {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            transform: none;
        }

        .wifi-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: 12px;
            background: #f8f9fa;
            display: none;
        }

        .wifi-list.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wifi-item {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #eee;
        }

        .wifi-item:last-child {
            border-bottom: none;
        }

        .wifi-item:hover {
            background: #e9ecef;
        }

        .wifi-item:active {
            background: #dee2e6;
        }

        .wifi-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wifi-info .name {
            font-weight: 500;
            color: #1a1a2e;
            font-size: 14px;
        }

        .wifi-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #888;
        }

        .signal-strong {
            color: #11998e;
        }

        .signal-medium {
            color: #f39c12;
        }

        .signal-weak {
            color: #e74c3c;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .status.success {
            display: block;
            background: linear-gradient(135deg, rgba(17, 153, 142, 0.1), rgba(56, 239, 125, 0.1));
            color: #11998e;
            border: 1px solid rgba(17, 153, 142, 0.2);
        }

        .status.error {
            display: block;
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.1), rgba(192, 57, 43, 0.1));
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e9ecef;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: #666;
            font-size: 14px;
        }

        /* 滚动条美化 */
        .wifi-list::-webkit-scrollbar {
            width: 4px;
        }

        .wifi-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .wifi-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        /* 连接状态指示 */
        .connection-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: #888;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.connected {
            background: #11998e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon">⌚</div>
            <h1>智能手表配网</h1>
            <p>连接WiFi，开启智能生活</p>
        </div>

        <button id="scan-btn" class="btn btn-scan">
            <span>📡</span>
            <span>扫描WiFi网络</span>
        </button>

        <div id="wifi-list-container" class="wifi-list">
            <div id="wifi-list"></div>
        </div>

        <div class="form-group">
            <label>WiFi名称</label>
            <input type="text" id="ssid" placeholder="点击上方扫描或手动输入">
        </div>

        <div class="form-group">
            <label>WiFi密码</label>
            <input type="password" id="password" placeholder="请输入WiFi密码">
        </div>

        <button id="submit-btn" class="btn btn-submit">
            <span>🚀</span>
            <span>开始配网</span>
        </button>

        <div id="status" class="status"></div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p id="loading-text">正在处理...</p>
        </div>

        <div class="connection-status">
            <span class="status-dot" id="ws-status"></span>
            <span id="ws-text">正在连接设备...</span>
        </div>
    </div>

    <script>
        // WebSocket 网关地址：固定使用当前主机 /ws 端点。
        var gateway = `ws://${window.location.hostname}/ws`;
        var websocket;       // WebSocket 连接对象
        let scanTimeId;      // 扫描超时计时器
        let connectTimeId;   // 连接超时计时器

        window.addEventListener('load', onLoad);

        function onLoad(event) {
            initWebSocket();
        }

        function initWebSocket() {
            console.log('Connecting to WebSocket...');
            updateConnectionStatus(false, '正在连接设备...');
            websocket = new WebSocket(gateway);
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage;
        }

        function onOpen(event) {
            console.log('WebSocket connected');
            updateConnectionStatus(true, '设备已连接');
        }

        function onClose(event) {
            console.log('WebSocket closed');
            updateConnectionStatus(false, '连接断开，重连中...');
            // 清除连接超时计时器
            clearTimeout(connectTimeId);
            setTimeout(initWebSocket, 3000);
        }

        function updateConnectionStatus(connected, text) {
            const dot = document.getElementById('ws-status');
            const textEl = document.getElementById('ws-text');
            dot.className = connected ? 'status-dot connected' : 'status-dot';
            textEl.textContent = text;
        }

        function onMessage(event) {
            const data = JSON.parse(event.data); // 服务器统一使用 JSON 协议
            console.log('Received:', data);

            // 处理WiFi列表
            if (data.wifi_list) {
                handleWifiList(data.wifi_list);
            }

            // 处理连接状态
            if (data.status) {
                handleConnectStatus(data);
            }
        }

        function handleWifiList(wifiList) {
            clearTimeout(scanTimeId);

            const container = document.getElementById('wifi-list-container');
            const listEl = document.getElementById('wifi-list');
            const btn = document.getElementById('scan-btn');

            listEl.innerHTML = '';

            // 按信号强度排序并去重（同名SSID只保留信号最强的）
            const uniqueWifi = {}; // 以 SSID 为 key 去重
            wifiList.forEach(wifi => {
                if (!uniqueWifi[wifi.ssid] || uniqueWifi[wifi.ssid].rssi < wifi.rssi) {
                    uniqueWifi[wifi.ssid] = wifi;
                }
            });
            const sortedList = Object.values(uniqueWifi).sort((a, b) => b.rssi - a.rssi);

            sortedList.forEach(wifi => {
                const item = document.createElement('div');
                item.className = 'wifi-item';
                item.innerHTML = `
                    <div class="wifi-info">
                        <span>${wifi.encrypted ? '🔒' : '🌐'}</span>
                        <span class="name">${wifi.ssid}</span>
                    </div>
                    <div class="wifi-meta">
                        <span class="${getSignalClass(wifi.rssi)}">${getSignalIcon(wifi.rssi)}</span>
                        <span>${wifi.rssi}dBm</span>
                    </div>
                `;

                item.addEventListener('click', () => {
                    document.getElementById('ssid').value = wifi.ssid;
                    document.getElementById('password').focus();
                    // 高亮选中项
                    document.querySelectorAll('.wifi-item').forEach(el => el.style.background = '');
                    item.style.background = '#e3f2fd';
                });

                listEl.appendChild(item);
            });

            container.classList.add('show');
            hideLoading();
            btn.disabled = false;
            btn.innerHTML = '<span>🔄</span><span>重新扫描</span>';
            showStatus(`扫描完成，发现 ${sortedList.length} 个网络`, 'success');
        }

        function handleConnectStatus(data) {
            // 清除连接超时计时器
            clearTimeout(connectTimeId);
            hideLoading();

            const btn = document.getElementById('submit-btn');

            if (data.status === 'connected') {
                showStatus(`✓ 已连接到 "${data.ssid}"，IP: ${data.ip}`, 'success');
                btn.disabled = true;
                btn.innerHTML = '<span>✓</span><span>连接成功</span>';
                updateConnectionStatus(true, '配网成功');
            } else if (data.status === 'failed') {
                showStatus(`✗ 连接 "${data.ssid}" 失败，请检查密码后重试`, 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>🚀</span><span>重新配网</span>';
                // 清空密码框，聚焦以便重新输入
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        // 扫描按钮
        document.getElementById('scan-btn').addEventListener('click', function () {
            const btn = this;
            const listEl = document.getElementById('wifi-list');

            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span><span>扫描中...</span>';
            listEl.innerHTML = '';
            showLoading('正在扫描WiFi网络...');

            websocket.send(JSON.stringify({ scan: 'start' }));

            scanTimeId = setTimeout(() => {
                btn.innerHTML = '<span>📡</span><span>重新扫描</span>';
                btn.disabled = false;
                hideLoading();
                showStatus('扫描超时，请重试', 'error');
            }, 15000);
        });

        // 配网按钮
        document.getElementById('submit-btn').addEventListener('click', function () {
            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value;

            if (!ssid) {
                showStatus('请输入或选择WiFi名称', 'error');
                return;
            }

            this.disabled = true;
            this.innerHTML = '<span>⏳</span><span>连接中...</span>';
            showLoading(`正在连接 "${ssid}"...`);

            websocket.send(JSON.stringify({ ssid, password }));

            // 设置连接超时（15秒，因为ESP32会重试2次）
            connectTimeId = setTimeout(() => {
                hideLoading();
                this.disabled = false;
                this.innerHTML = '<span>🚀</span><span>重新配网</span>';
                showStatus('连接超时，请重试', 'error');
            }, 15000);
        });

        function showLoading(text) {
            document.getElementById('loading-text').textContent = text;
            document.getElementById('loading').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }

        function showStatus(message, type) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = 'status ' + type;
        }

        function getSignalIcon(rssi) {
            if (rssi >= -50) return '●●●●';
            if (rssi >= -65) return '●●●○';
            if (rssi >= -75) return '●●○○';
            return '●○○○';
        }

        function getSignalClass(rssi) {
            if (rssi >= -50) return 'signal-strong';
            if (rssi >= -70) return 'signal-medium';
            return 'signal-weak';
        }
    </script>
</body>

</html>
