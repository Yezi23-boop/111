<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>手表 Wi-Fi 配网</title>
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <main class="portal-shell">
        <section class="hero-panel" aria-label="手表 Wi-Fi 配网">
            <header class="portal-header">
                <p class="portal-kicker">手表 Wi-Fi 配网</p>
                <p class="portal-copy">选择 Wi-Fi，输入密码，手表会自动连接。</p>
            </header>

            <section class="portal-status" aria-live="polite">
                <div class="status-row">
                    <span class="status-dot" id="api-dot"></span>
                    <div>
                        <span class="status-label">设备状态</span>
                        <strong id="api-text">正在检测设备门户...</strong>
                        <p id="api-note">正在通过官方 provisioning 接口读取状态。</p>
                    </div>
                </div>
            </section>

            <section class="quick-guide" aria-label="当前配网状态">
                <div class="guide-summary">
                    <span>当前状态</span>
                    <strong id="current-step-text">正在检测设备门户</strong>
                </div>
                <div class="guide-track" aria-label="配网步骤">
                    <div class="guide-step active">
                        <span>1</span>
                        <strong>连接热点</strong>
                    </div>
                    <div class="guide-step" id="scan-step">
                        <span>2</span>
                        <strong>选择网络</strong>
                    </div>
                    <div class="guide-step" id="send-step">
                        <span>3</span>
                        <strong>发送凭据</strong>
                    </div>
                </div>
            </section>

            <section class="portal-actions" aria-label="门户操作">
                <button id="scan-btn" class="primary-btn" type="button">
                    <span class="btn-icon" aria-hidden="true">⌁</span>
                    扫描 Wi-Fi
                </button>
                <button id="refresh-btn" class="ghost-btn" type="button">
                    <span class="btn-icon" aria-hidden="true">↻</span>
                    刷新状态
                </button>
            </section>

            <section class="wifi-list-wrap" aria-labelledby="wifi-list-title">
                <div class="section-title-row">
                    <div>
                        <h2 id="wifi-list-title">附近网络</h2>
                        <p>点击网络可自动填入名称。</p>
                    </div>
                    <span id="scan-capability" class="capability-chip pending">扫描检测中</span>
                </div>
                <div id="wifi-list" class="wifi-list empty"></div>
            </section>

            <section class="portal-form" aria-labelledby="form-title">
                <div class="section-title-row form-heading">
                    <div>
                        <h2 id="form-title">Wi-Fi 凭据</h2>
                        <p>密码只会发送给当前设备门户。</p>
                    </div>
                </div>

                <div class="field">
                    <label for="ssid">网络名称</label>
                    <input id="ssid" name="ssid" type="text" placeholder="输入 SSID 或从上方选择" autocomplete="off">
                </div>

                <div class="field">
                    <label for="password">网络密码</label>
                    <div class="password-wrap">
                        <input id="password" name="password" type="password" placeholder="输入 Wi-Fi 密码" autocomplete="current-password">
                        <button id="toggle-password-btn" class="icon-btn" type="button" aria-label="显示密码">显</button>
                    </div>
                </div>

                <button id="configure-btn" class="secondary-btn" type="button">
                    <span class="btn-icon" aria-hidden="true">✓</span>
                    发送到手表
                </button>
            </section>

            <section id="feedback" class="feedback hidden" aria-live="polite"></section>
        </section>
    </main>

    <script type="module" src="/app.js"></script>
</body>

</html>
