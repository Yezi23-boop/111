<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152">
<style>
text { font-family: 'Microsoft YaHei', 'PingFang SC', 'SimHei', 'Helvetica Neue', Arial, sans-serif; }
.title { font-size: 44px; font-weight: 700; fill: #0f172a; }
.label { font-size: 31px; font-weight: 700; fill: #111827; }
.small { font-size: 25px; font-weight: 600; fill: #374151; }
.hint { font-size: 22px; font-weight: 600; fill: #6b7280; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#2563eb"/></marker>
<marker id="arrow-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#dc2626"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#ea580c"/></marker>
<marker id="arrow-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#7c3aed"/></marker>
<marker id="arrow-cyan" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#0891b2"/></marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0, 12 4.5, 0 9" fill="#6b7280"/></marker>
</defs>
<rect width="2048" height="1152" fill="#ffffff"/>
<text x="1024.0" y="92" text-anchor="middle" class="title">风险状态机图</text>
<rect x="160" y="455" width="270" height="120" rx="60.0" fill="#f9fafb" stroke="#e5e7eb" stroke-width="3"/><text x="295.0" y="525.0" text-anchor="middle" class="label">Off</text>
<rect x="500" y="455" width="270" height="120" rx="60.0" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/><text x="635.0" y="525.0" text-anchor="middle" class="label">Monitoring</text>
<rect x="880" y="455" width="270" height="120" rx="60.0" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/><text x="1015.0" y="525.0" text-anchor="middle" class="label">Suspicious</text>
<rect x="1260" y="455" width="270" height="120" rx="60.0" fill="#fef2f2" stroke="#fecaca" stroke-width="3"/><text x="1395.0" y="525.0" text-anchor="middle" class="label">Alerting</text>
<rect x="880" y="780" width="270" height="120" rx="60.0" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/><text x="1015.0" y="850.0" text-anchor="middle" class="label">Cooldown</text>
<line x1="430" y1="515" x2="500" y2="515" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
<rect x="417.0" y="471.0" width="96" height="34" rx="9" fill="#ffffff" opacity="0.96"/>
<text x="465.0" y="496.0" text-anchor="middle" class="hint">开启</text>
<line x1="770" y1="515" x2="880" y2="515" stroke="#ea580c" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/>
<rect x="705.0" y="471.0" width="240" height="34" rx="9" fill="#ffffff" opacity="0.96"/>
<text x="825.0" y="496.0" text-anchor="middle" class="hint">单窗 danger</text>
<line x1="1150" y1="515" x2="1260" y2="515" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrow-red)"/>
<rect x="1145.0" y="471.0" width="120" height="34" rx="9" fill="#ffffff" opacity="0.96"/>
<text x="1205.0" y="496.0" text-anchor="middle" class="hint">连续确认</text>
<path d="M 1395,575 L 1395,840 L 1150,840" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrow-red)"/>
<rect x="1220.0" y="806" width="120" height="34" rx="9" fill="#ffffff" opacity="0.96"/>
<text x="1280" y="831" text-anchor="middle" class="hint">保持结束</text>
<path d="M 880,840 L 635,840 L 635,575" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="670.0" y="806" width="120" height="34" rx="9" fill="#ffffff" opacity="0.96"/>
<text x="730" y="831" text-anchor="middle" class="hint">冷却结束</text>
</svg>